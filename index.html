<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Posiciones | Torneo de Fútbol</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-trophy-fill text-warning fs-4"></i>
        <span>Torneo de Fútbol</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegación">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">
              <i class="bi bi-table me-1"></i> Posiciones
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="equipos.html">
              <i class="bi bi-shield-shaded me-1"></i> Equipos
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="partidos.html">
              <i class="bi bi-calendar-event me-1"></i> Partidos
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h1 class="h2 mb-1 fw-bold text-dark">
          <i class="bi bi-bar-chart-line text-primary me-2"></i>Tabla de Posiciones
        </h1>
        <p class="text-muted mb-0">Clasificación oficial y estadísticas generales del torneo.</p>
      </div>
    </div>

    <!-- Tarjeta de la Tabla -->
    <div class="card card-custom p-3 p-md-4">
      <div class="table-responsive">
        <table class="table table-hover table-posiciones align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" style="width: 60px;">#</th>
              <th scope="col" class="text-start">Equipo</th>
              <th scope="col" title="Partidos Jugados">PJ</th>
              <th scope="col" title="Partidos Ganados">G</th>
              <th scope="col" title="Partidos Empatados">E</th>
              <th scope="col" title="Partidos Perdidos">P</th>
              <th scope="col" title="Goles a Favor">GF</th>
              <th scope="col" title="Goles en Contra">GC</th>
              <th scope="col" title="Diferencia de Goles">DG</th>
              <th scope="col" class="fw-bold" title="Puntos Totales">PTS</th>
            </tr>
          </thead>
          <tbody id="tabla-posiciones-body">
            <!-- Filas generadas dinámicamente mediante js/posiciones.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="py-3 text-center">
    <div class="container">
      <small>&copy; 2026 Sistema de Tabla de Posiciones de Fútbol. Desarrollado paso a paso.</small>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lógica de Tabla de Posiciones -->
  <script src="js/posiciones.js"></script>
</body>
</html>
