<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar Equipos | Torneo de Fútbol</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-trophy-fill text-warning fs-4"></i>
        <span>Torneo de Fútbol</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegación">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">
              <i class="bi bi-table me-1"></i> Posiciones
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="equipos.html">
              <i class="bi bi-shield-shaded me-1"></i> Equipos
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="partidos.html">
              <i class="bi bi-calendar-event me-1"></i> Partidos
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container my-5">
    <div class="mb-4">
      <h1 class="h2 mb-1 fw-bold text-dark">
        <i class="bi bi-shield-shaded text-primary me-2"></i>Administración de Equipos
      </h1>
      <p class="text-muted mb-0">Registra, edita o elimina los clubes participantes del torneo.</p>
    </div>

    <div class="row g-4">
      <!-- Formulario para agregar equipo -->
      <div class="col-lg-4">
        <div class="card card-custom p-4">
          <h2 class="h5 fw-bold mb-3">
            <i class="bi bi-plus-circle me-1 text-success"></i> Nuevo Equipo
          </h2>
          <form id="form-equipo">
            <div class="mb-3">
              <label for="nombre-equipo" class="form-label fw-semibold">Nombre del Equipo</label>
              <input type="text" class="form-control" id="nombre-equipo" placeholder="Ej. Real Madrid, Barcelona..." required>
            </div>
            <div class="mb-3">
              <label for="logo-equipo" class="form-label fw-semibold">URL del Escudo (Opcional)</label>
              <input type="url" class="form-control" id="logo-equipo" placeholder="https://ejemplo.com/escudo.png">
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-save me-1"></i> Guardar Equipo
            </button>
          </form>
        </div>
      </div>

      <!-- Lista de equipos registrados -->
      <div class="col-lg-8">
        <div class="card card-custom p-4">
          <h2 class="h5 fw-bold mb-3">
            <i class="bi bi-list-check me-1 text-primary"></i> Equipos Participantes
          </h2>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col" style="width: 50px;">#</th>
                  <th scope="col" style="width: 70px;">Escudo</th>
                  <th scope="col">Nombre</th>
                  <th scope="col" class="text-center" style="width: 140px;">Acciones</th>
                </tr>
              </thead>
              <tbody id="lista-equipos-body">
                <!-- Generado dinámicamente mediante js/equipos.js -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="py-3 text-center">
    <div class="container">
      <small>&copy; 2026 Sistema de Tabla de Posiciones de Fútbol. Desarrollado paso a paso.</small>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Configuración de Supabase -->
  <script src="js/supabase.js"></script>
  <!-- Almacenamiento Local (LocalStorage) -->
  <script src="js/storage.js"></script>
  <!-- Lógica de Equipos -->
  <script src="js/equipos.js"></script>
</body>
</html>
